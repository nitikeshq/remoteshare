name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Check disk preflight
        run: npm run check:disk

      - name: Verify release scripts
        run: npm run verify:release-scripts

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check Rust
        run: node scripts/ci-run-with-annotation.mjs "Rust check" npm run check:rust

      - name: Test Rust
        run: node scripts/ci-run-with-annotation.mjs "Rust tests" npm run test:rust

      - name: Build frontend
        run: npm run build:frontend
