[package]
name = "remoteshare"
version = "0.1.8"
description = "Cross-platform keyboard and mouse sharing."
authors = ["RemoteShare contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/remoteshare/remoteshare"

[lib]
name = "remoteshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
dirs-next = "2.0"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.5.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.2.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
